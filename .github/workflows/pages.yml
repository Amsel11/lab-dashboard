name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assemble the published site: the dashboard files at the root plus a copy
      # of the data folder, so the page can fetch ./data/projects.json.
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -R dashboard/. _site/
          cp data/projects.json _site/data/projects.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
